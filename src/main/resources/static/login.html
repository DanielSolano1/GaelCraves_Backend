<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - GaelCraves</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #020617;
        border-radius: 0.75rem;
        padding: 2rem 2.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin-top: 0;
        margin-bottom: 1.75rem;
        color: #9ca3af;
        font-size: 0.95rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        background: #111827;
        color: #e5e7eb;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid #4b5563;
        transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
      }
      a.button:hover {
        background: #1f2937;
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      }
      .icon {
        font-size: 1.1rem;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign in to GaelCraves</h1>
      <p>Use your GitHub account to continue on the web app.</p>
      <a class="button" href="/oauth2/authorization/github">
        <span class="icon">f419</span>
        <span>Continue with GitHub</span>
      </a>
      <div class="hint">After login you'll be redirected back to the GaelCraves web frontend.</div>
    </div>
  </body>
</html>
