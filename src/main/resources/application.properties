spring.application.name=GaelCravings_Backend

# --- Database (read from env) ---
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/gaelcraves}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- CORS / JWT ---
app.cors.allowed-origin=${FRONTEND_ORIGIN:https://gaelcraves-frontend-7a6e5c03f69a.herokuapp.com,http://localhost:8081}
app.jwt.secret=${APP_JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Google OAuth (Optional - set empty defaults) ---
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# --- Supabase (Optional) ---
supabase.project.url=${SUPABASE_URL:}
supabase.api.key=${SUPABASE_KEY:}

# --- Connection Pool (Heroku optimized) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Auto-reconnect and handle stale connections
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# Prevent prepared statement conflicts
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# JPA Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# --- Server Configuration ---
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# --- Logging ---
logging.level.root=INFO
logging.level.com.gaelcraves=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO


